[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --junit-xml=../test-artifacts/junit/hap-junit.xml
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require PostgreSQL)
    smoke: Smoke tests
    perf: Performance/benchmark tests
    slow: Slow tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
